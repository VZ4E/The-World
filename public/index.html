<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Respawn Signal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#f0f4ff',
              100: '#dde7ff',
              400: '#7b9ef8',
              500: '#4f74f3',
              600: '#3a5ce8',
              700: '#2d49cc',
              900: '#1a2a6b',
            },
            surface: {
              900: '#0d0f14',
              800: '#13161d',
              700: '#1a1e28',
              600: '#222736',
              500: '#2c3347',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    body { background-color: #0d0f14; }
    .skeleton { animation: pulse 1.5s cubic-bezier(0.4,0,0.6,1) infinite; background: #1a1e28; border-radius: 4px; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .badge-sponsored { background: rgba(251,146,60,.15); color: #fb923c; border: 1px solid rgba(251,146,60,.3); }
    .badge-organic   { background: rgba(52,211,153,.15); color: #34d399; border: 1px solid rgba(52,211,153,.3); }
    .badge-unknown   { background: rgba(148,163,184,.12); color: #94a3b8; border: 1px solid rgba(148,163,184,.2); }
    .badge-positive  { background: rgba(52,211,153,.12); color: #34d399; }
    .badge-negative  { background: rgba(248,113,113,.12); color: #f87171; }
    .badge-neutral   { background: rgba(148,163,184,.12); color: #94a3b8; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; height: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #2c3347; border-radius: 4px; }
    .tab-active { border-bottom: 2px solid #4f74f3; color: #fff; }
    .tab-inactive { border-bottom: 2px solid transparent; color: #64748b; }
    .fade-in { animation: fadeIn .3s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .confidence-bar { height: 3px; border-radius: 2px; background: #1a1e28; }
    .confidence-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #4f74f3, #7b9ef8); }
  </style>
</head>
<body class="font-sans text-slate-200 min-h-screen">

  <!-- Top Nav -->
  <nav class="border-b border-surface-600 bg-surface-800 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-7 h-7 rounded-md bg-brand-500 flex items-center justify-center text-white font-bold text-sm">R</div>
        <span class="font-semibold text-white tracking-tight">Respawn Signal</span>
        <span class="hidden sm:inline text-xs text-slate-500 font-mono border border-surface-600 px-1.5 py-0.5 rounded">BETA</span>
      </div>
      <div class="flex items-center gap-3 text-xs text-slate-500">
        <span id="last-updated">—</span>
        <button onclick="refreshAll()" id="refresh-btn"
          class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md bg-surface-700 hover:bg-surface-600 text-slate-300 transition-colors text-xs">
          <svg id="refresh-icon" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          Refresh
        </button>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">

    <!-- Stats Cards -->
    <section id="stats-section">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="stats-cards">
        <!-- filled by JS -->
        <div class="skeleton h-24 rounded-xl"></div>
        <div class="skeleton h-24 rounded-xl"></div>
        <div class="skeleton h-24 rounded-xl"></div>
        <div class="skeleton h-24 rounded-xl"></div>
      </div>
    </section>

    <!-- Pipeline Health -->
    <section class="bg-surface-800 border border-surface-600 rounded-xl p-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-white">Pipeline Health</h2>
        <a href="#" onclick="showTab('pipeline'); return false" class="text-xs text-brand-400 hover:text-brand-300">Full view →</a>
      </div>
      <div id="pipeline-mini" class="space-y-2">
        <div class="skeleton h-5 rounded"></div>
        <div class="skeleton h-5 rounded"></div>
      </div>
    </section>

    <!-- Main Tabs -->
    <section class="bg-surface-800 border border-surface-600 rounded-xl overflow-hidden">
      <div class="flex border-b border-surface-600 px-4 gap-1">
        <button class="tab-btn tab-active text-sm font-medium px-3 py-3" data-tab="mentions" onclick="showTab('mentions')">Mentions</button>
        <button class="tab-btn tab-inactive text-sm font-medium px-3 py-3" data-tab="brands" onclick="showTab('brands')">Top Brands</button>
        <button class="tab-btn tab-inactive text-sm font-medium px-3 py-3" data-tab="creators" onclick="showTab('creators')">Creators</button>
        <button class="tab-btn tab-inactive text-sm font-medium px-3 py-3" data-tab="pipeline" onclick="showTab('pipeline')">Pipeline</button>
      </div>

      <!-- Mentions Tab -->
      <div id="tab-mentions" class="tab-panel p-4">
        <!-- Filters -->
        <div class="flex flex-wrap gap-2 mb-4">
          <input id="filter-brand" type="text" placeholder="Search brand…"
            class="bg-surface-700 border border-surface-600 rounded-lg px-3 py-1.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-500 w-40"
            oninput="debounceLoadMentions()" />
          <select id="filter-type" onchange="loadMentions(1)"
            class="bg-surface-700 border border-surface-600 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-brand-500">
            <option value="">All types</option>
            <option value="sponsored">Sponsored</option>
            <option value="organic">Organic</option>
            <option value="unknown">Unknown</option>
          </select>
          <select id="filter-sentiment" onchange="loadMentions(1)"
            class="bg-surface-700 border border-surface-600 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-brand-500">
            <option value="">All sentiment</option>
            <option value="positive">Positive</option>
            <option value="negative">Negative</option>
            <option value="neutral">Neutral</option>
          </select>
          <select id="filter-platform" onchange="loadMentions(1)"
            class="bg-surface-700 border border-surface-600 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-brand-500">
            <option value="">All platforms</option>
            <option value="tiktok">TikTok</option>
            <option value="twitch">Twitch</option>
          </select>
        </div>

        <div id="mentions-table-wrap" class="overflow-x-auto scrollbar-thin">
          <div class="space-y-2" id="mentions-list">
            <div class="skeleton h-14 rounded-lg"></div>
            <div class="skeleton h-14 rounded-lg"></div>
            <div class="skeleton h-14 rounded-lg"></div>
            <div class="skeleton h-14 rounded-lg"></div>
            <div class="skeleton h-14 rounded-lg"></div>
          </div>
        </div>
        <div id="mentions-pagination" class="flex items-center justify-between mt-4 text-xs text-slate-500"></div>
      </div>

      <!-- Brands Tab -->
      <div id="tab-brands" class="tab-panel p-4 hidden">
        <div class="flex gap-2 mb-4">
          <select id="brands-type" onchange="loadBrands()"
            class="bg-surface-700 border border-surface-600 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-brand-500">
            <option value="">All types</option>
            <option value="sponsored">Sponsored</option>
            <option value="organic">Organic</option>
          </select>
          <select id="brands-platform" onchange="loadBrands()"
            class="bg-surface-700 border border-surface-600 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-brand-500">
            <option value="">All platforms</option>
            <option value="tiktok">TikTok</option>
            <option value="twitch">Twitch</option>
          </select>
        </div>
        <div id="brands-list" class="space-y-2">
          <div class="skeleton h-12 rounded-lg"></div>
          <div class="skeleton h-12 rounded-lg"></div>
          <div class="skeleton h-12 rounded-lg"></div>
          <div class="skeleton h-12 rounded-lg"></div>
          <div class="skeleton h-12 rounded-lg"></div>
        </div>
      </div>

      <!-- Creators Tab -->
      <div id="tab-creators" class="tab-panel p-4 hidden">
        <div class="flex gap-2 mb-4">
          <select id="creators-platform" onchange="loadCreators()"
            class="bg-surface-700 border border-surface-600 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-brand-500">
            <option value="">All platforms</option>
            <option value="tiktok">TikTok</option>
            <option value="twitch">Twitch</option>
          </select>
        </div>
        <div id="creators-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="skeleton h-28 rounded-xl"></div>
          <div class="skeleton h-28 rounded-xl"></div>
          <div class="skeleton h-28 rounded-xl"></div>
          <div class="skeleton h-28 rounded-xl"></div>
        </div>
      </div>

      <!-- Pipeline Tab -->
      <div id="tab-pipeline" class="tab-panel p-4 hidden">
        <div id="pipeline-detail" class="space-y-4">
          <div class="skeleton h-32 rounded-xl"></div>
          <div class="skeleton h-32 rounded-xl"></div>
        </div>
      </div>
    </section>

  </div>

  <!-- Mention Detail Drawer -->
  <div id="drawer-overlay" class="fixed inset-0 bg-black/60 z-40 hidden" onclick="closeDrawer()"></div>
  <aside id="drawer" class="fixed right-0 top-0 h-full w-full max-w-md bg-surface-800 border-l border-surface-600 z-50 translate-x-full transition-transform duration-300 ease-in-out overflow-y-auto scrollbar-thin">
    <div class="p-5 space-y-4" id="drawer-content"></div>
  </aside>

<script>
// ─── Config ────────────────────────────────────────────────────────────────
const BASE = '' // same origin; swap to full URL if frontend is separate

// ─── State ─────────────────────────────────────────────────────────────────
let mentionsPage = 1
let mentionsTotal = 0
const PAGE_SIZE = 25

// ─── Fetch helpers ──────────────────────────────────────────────────────────
async function api(path) {
  const res = await fetch(BASE + path)
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`)
  return res.json()
}

// ─── Init ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  refreshAll()
  setInterval(refreshAll, 60_000) // auto-refresh every 60s
})

async function refreshAll() {
  const icon = document.getElementById('refresh-icon')
  icon.style.animation = 'spin 1s linear infinite'
  icon.style.setProperty('--tw-rotate','360deg')

  await Promise.allSettled([
    loadStats(),
    loadPipelineMini(),
    loadMentions(1),
  ])

  icon.style.animation = ''
  document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString()
}

// ─── Stats ───────────────────────────────────────────────────────────────────
async function loadStats() {
  try {
    const { creators, videos, mentions, pipeline } = await api('/api/dashboard/stats')
    document.getElementById('stats-cards').innerHTML = `
      ${statCard('Creators', creators.active, 'of ' + creators.total + ' active', '#4f74f3',
        `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0"/>`)}
      ${statCard('Videos Analyzed', videos.analyzed, 'of ' + videos.total + ' fetched', '#34d399',
        `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>`)}
      ${statCard('Brand Mentions', mentions.total, mentions.last_24h + ' in last 24h', '#fb923c',
        `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>`)}
      ${statCard('Pipeline Backlog', pipeline.pending_transcription + pipeline.pending_analysis,
        pipeline.pending_transcription + ' transcribing · ' + pipeline.pending_analysis + ' analyzing',
        pipeline.pending_transcription + pipeline.pending_analysis > 0 ? '#f87171' : '#34d399',
        `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>`)}
    `
  } catch(e) { console.error('stats:', e) }
}

function statCard(label, value, sub, color, iconPath) {
  return `
  <div class="bg-surface-700 border border-surface-600 rounded-xl p-4 fade-in">
    <div class="flex items-start justify-between">
      <div>
        <p class="text-xs text-slate-400 font-medium">${label}</p>
        <p class="text-2xl font-bold text-white mt-1">${fmt(value)}</p>
        <p class="text-xs text-slate-500 mt-1">${sub}</p>
      </div>
      <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:${color}22">
        <svg class="w-4 h-4" style="color:${color}" fill="none" viewBox="0 0 24 24" stroke="currentColor">${iconPath}</svg>
      </div>
    </div>
  </div>`
}

// ─── Pipeline Mini ───────────────────────────────────────────────────────────
async function loadPipelineMini() {
  try {
    const d = await api('/api/dashboard/pipeline')
    document.getElementById('pipeline-mini').innerHTML = `
      ${pipelineBar('Transcription', d.transcription)}
      ${pipelineBar('Analysis', d.analysis)}
    `
  } catch(e) { console.error('pipeline-mini:', e) }
}

function pipelineBar(label, s) {
  const total = (s.pending||0) + (s.processing||0) + (s.completed||0) + (s.failed||0) + (s.skipped||0)
  if (total === 0) return `<div class="text-xs text-slate-500">${label}: no data</div>`
  const pct = (n) => total ? ((n/total)*100).toFixed(1) : 0
  return `
  <div>
    <div class="flex justify-between text-xs mb-1">
      <span class="text-slate-400">${label}</span>
      <span class="text-slate-500">${fmt(s.completed)} / ${fmt(total)} complete</span>
    </div>
    <div class="h-2 flex rounded-full overflow-hidden bg-surface-600">
      <div style="width:${pct(s.completed)}%;background:#34d399" title="Completed: ${s.completed}"></div>
      <div style="width:${pct(s.processing)}%;background:#4f74f3" title="Processing: ${s.processing}"></div>
      <div style="width:${pct(s.pending)}%;background:#2c3347" title="Pending: ${s.pending}"></div>
      <div style="width:${pct(s.failed)}%;background:#f87171" title="Failed: ${s.failed}"></div>
      ${s.skipped !== undefined ? `<div style="width:${pct(s.skipped)}%;background:#64748b" title="Skipped: ${s.skipped}"></div>` : ''}
    </div>
    <div class="flex gap-3 mt-1 text-xs text-slate-500">
      ${s.failed > 0 ? `<span class="text-red-400">${s.failed} failed</span>` : ''}
      ${s.processing > 0 ? `<span class="text-brand-400">${s.processing} running</span>` : ''}
      ${s.pending > 0 ? `<span>${s.pending} queued</span>` : ''}
    </div>
  </div>`
}

// ─── Mentions ────────────────────────────────────────────────────────────────
let debounceTimer
function debounceLoadMentions() {
  clearTimeout(debounceTimer)
  debounceTimer = setTimeout(() => loadMentions(1), 400)
}

async function loadMentions(page = mentionsPage) {
  mentionsPage = page
  const brand     = document.getElementById('filter-brand').value.trim()
  const type      = document.getElementById('filter-type').value
  const sentiment = document.getElementById('filter-sentiment').value
  const platform  = document.getElementById('filter-platform').value

  const params = new URLSearchParams({ page, limit: PAGE_SIZE })
  if (brand)     params.set('brand', brand)
  if (type)      params.set('mention_type', type)
  if (sentiment) params.set('sentiment', sentiment)
  if (platform)  params.set('platform', platform)

  const list = document.getElementById('mentions-list')
  list.innerHTML = Array(5).fill('<div class="skeleton h-14 rounded-lg"></div>').join('')

  try {
    const { data, meta } = await api(`/api/dashboard/mentions?${params}`)
    mentionsTotal = meta.total

    if (!data.length) {
      list.innerHTML = empty('No mentions match your filters')
      document.getElementById('mentions-pagination').innerHTML = ''
      return
    }

    list.innerHTML = data.map(m => `
    <div onclick="openDrawer(${JSON.stringify(m).replace(/"/g,'&quot;')})"
      class="flex items-start gap-3 p-3 rounded-lg bg-surface-700 hover:bg-surface-600 cursor-pointer transition-colors fade-in group">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-semibold text-white text-sm">${esc(m.brand_name)}</span>
          <span class="text-xs px-1.5 py-0.5 rounded-full font-medium badge-${m.mention_type}">${m.mention_type}</span>
          <span class="text-xs px-1.5 py-0.5 rounded-full badge-${m.sentiment}">${m.sentiment}</span>
          ${platformBadge(m.creators?.platform)}
        </div>
        <p class="text-xs text-slate-400 mt-0.5 truncate">${esc(m.context_snippet || '—')}</p>
        <p class="text-xs text-slate-500 mt-0.5">${esc(m.creators?.name || '')} · ${relTime(m.created_at)}</p>
      </div>
      <div class="text-right shrink-0">
        <div class="text-xs text-slate-500 mb-1">${((m.confidence_score||0)*100).toFixed(0)}% conf</div>
        <div class="confidence-bar w-16"><div class="confidence-fill" style="width:${((m.confidence_score||0)*100)}%"></div></div>
      </div>
    </div>`).join('')

    renderPagination(meta)
  } catch(e) {
    list.innerHTML = errMsg('Failed to load mentions')
    console.error('mentions:', e)
  }
}

function renderPagination({ page, limit, total }) {
  const pages = Math.ceil(total / limit)
  const el = document.getElementById('mentions-pagination')
  if (pages <= 1) { el.innerHTML = `<span>${total} results</span>`; return }
  el.innerHTML = `
    <span>${total} results · page ${page} of ${pages}</span>
    <div class="flex gap-1">
      <button onclick="loadMentions(${page - 1})" ${page <= 1 ? 'disabled' : ''}
        class="px-2.5 py-1 rounded-md bg-surface-700 hover:bg-surface-600 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">←</button>
      <button onclick="loadMentions(${page + 1})" ${page >= pages ? 'disabled' : ''}
        class="px-2.5 py-1 rounded-md bg-surface-700 hover:bg-surface-600 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">→</button>
    </div>`
}

// ─── Brands ──────────────────────────────────────────────────────────────────
async function loadBrands() {
  const type     = document.getElementById('brands-type').value
  const platform = document.getElementById('brands-platform').value
  const params   = new URLSearchParams({ limit: 30 })
  if (type)     params.set('mention_type', type)
  if (platform) params.set('platform', platform)

  const list = document.getElementById('brands-list')
  list.innerHTML = Array(8).fill('<div class="skeleton h-12 rounded-lg"></div>').join('')

  try {
    const { data } = await api(`/api/dashboard/brands?${params}`)
    if (!data.length) { list.innerHTML = empty('No brand data yet'); return }

    const maxCount = data[0].total_mentions
    list.innerHTML = data.map((b, i) => `
    <div class="flex items-center gap-3 p-3 rounded-lg bg-surface-700 hover:bg-surface-600 transition-colors fade-in">
      <div class="text-slate-500 font-mono text-xs w-5 text-right">${i+1}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-1">
          <span class="font-semibold text-white text-sm">${esc(b.brand_name)}</span>
          <span class="text-xs text-slate-500">${b.creator_count} creator${b.creator_count !== 1 ? 's' : ''}</span>
        </div>
        <div class="h-1.5 bg-surface-600 rounded-full overflow-hidden w-full">
          <div class="h-full rounded-full bg-brand-500" style="width:${(b.total_mentions/maxCount*100).toFixed(1)}%"></div>
        </div>
      </div>
      <div class="text-right shrink-0">
        <div class="text-white font-semibold text-sm">${fmt(b.total_mentions)}</div>
        <div class="text-xs text-slate-500 mt-0.5 space-x-1">
          ${b.sponsored_count > 0 ? `<span class="text-orange-400">${b.sponsored_count}S</span>` : ''}
          ${b.organic_count > 0   ? `<span class="text-emerald-400">${b.organic_count}O</span>` : ''}
        </div>
      </div>
    </div>`).join('')
  } catch(e) {
    list.innerHTML = errMsg('Failed to load brands')
    console.error('brands:', e)
  }
}

// ─── Creators ────────────────────────────────────────────────────────────────
async function loadCreators() {
  const platform = document.getElementById('creators-platform').value
  const params   = new URLSearchParams()
  if (platform) params.set('platform', platform)

  const list = document.getElementById('creators-list')
  list.innerHTML = Array(4).fill('<div class="skeleton h-28 rounded-xl"></div>').join('')

  try {
    const { data } = await api(`/api/dashboard/creators?${params}`)
    if (!data.length) { list.innerHTML = empty('No creators found'); return }

    list.innerHTML = data.map(c => `
    <div class="bg-surface-700 border border-surface-600 rounded-xl p-4 fade-in">
      <div class="flex items-center gap-3 mb-3">
        ${c.avatar_url
          ? `<img src="${esc(c.avatar_url)}" class="w-9 h-9 rounded-full object-cover" />`
          : `<div class="w-9 h-9 rounded-full bg-surface-500 flex items-center justify-center text-slate-300 font-semibold text-sm">${esc(c.name[0])}</div>`}
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <span class="font-semibold text-white text-sm truncate">${esc(c.name)}</span>
            ${c.is_active ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shrink-0"></span>' : '<span class="w-1.5 h-1.5 rounded-full bg-slate-600 shrink-0"></span>'}
          </div>
          <div class="flex items-center gap-1.5 text-xs text-slate-400">
            ${platformBadge(c.platform)}
            <span>@${esc(c.handle)}</span>
          </div>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-surface-600 rounded-lg p-2">
          <div class="text-white font-semibold text-sm">${fmt(c.stats.videos_analyzed)}</div>
          <div class="text-xs text-slate-500">analyzed</div>
        </div>
        <div class="bg-surface-600 rounded-lg p-2">
          <div class="text-white font-semibold text-sm">${fmt(c.stats.mentions_total)}</div>
          <div class="text-xs text-slate-500">mentions</div>
        </div>
        <div class="bg-surface-600 rounded-lg p-2">
          <div class="text-orange-400 font-semibold text-sm">${fmt(c.stats.mentions_sponsored)}</div>
          <div class="text-xs text-slate-500">sponsored</div>
        </div>
      </div>
      ${c.stats.top_brands.length ? `
      <div class="mt-2 flex flex-wrap gap-1">
        ${c.stats.top_brands.map(b => `<span class="text-xs bg-surface-600 text-slate-400 px-1.5 py-0.5 rounded">${esc(b.brand_normalized)} <span class="text-slate-500">${b.count}</span></span>`).join('')}
      </div>` : ''}
    </div>`).join('')
  } catch(e) {
    list.innerHTML = `<div class="col-span-2">${errMsg('Failed to load creators')}</div>`
    console.error('creators:', e)
  }
}

// ─── Pipeline Detail ─────────────────────────────────────────────────────────
async function loadPipelineDetail() {
  const el = document.getElementById('pipeline-detail')
  el.innerHTML = '<div class="skeleton h-32 rounded-xl"></div><div class="skeleton h-32 rounded-xl mt-4"></div>'
  try {
    const d = await api('/api/dashboard/pipeline')
    el.innerHTML = `
      <div class="grid grid-cols-2 gap-4">
        ${statusBlock('Transcription', d.transcription)}
        ${statusBlock('Analysis', d.analysis)}
      </div>
      ${d.stuck.transcription.length || d.stuck.analysis.length ? `
      <div class="bg-yellow-500/10 border border-yellow-500/30 rounded-xl p-4">
        <h3 class="text-yellow-400 text-sm font-semibold mb-2">Stuck Jobs (>2h in processing)</h3>
        ${[...d.stuck.transcription, ...d.stuck.analysis].map(v => `
          <div class="text-xs text-slate-300 py-1 border-b border-surface-600 last:border-0">
            ${esc(v.creators?.name || 'Unknown')} — ${esc(v.title || v.id)} · last update ${relTime(v.updated_at)}
          </div>`).join('')}
      </div>` : ''}
      ${d.recent_failures.length ? `
      <div class="bg-surface-700 border border-surface-600 rounded-xl p-4">
        <h3 class="text-sm font-semibold text-white mb-3">Recent Failures</h3>
        <div class="space-y-2">
          ${d.recent_failures.map(v => `
          <div class="text-xs p-2 rounded-lg bg-surface-600">
            <div class="flex justify-between mb-0.5">
              <span class="text-slate-300">${esc(v.creators?.name || 'Unknown')} — ${esc(v.title || v.id)}</span>
              <span class="text-slate-500">${relTime(v.updated_at)}</span>
            </div>
            ${v.error_message ? `<div class="text-red-400 font-mono mt-0.5">${esc(v.error_message)}</div>` : ''}
            <div class="text-slate-500 mt-0.5">Retries: ${v.retry_count}</div>
          </div>`).join('')}
        </div>
      </div>` : ''}`
  } catch(e) {
    el.innerHTML = errMsg('Failed to load pipeline data')
    console.error('pipeline-detail:', e)
  }
}

function statusBlock(label, s) {
  const statuses = [
    { key:'completed',  label:'Done',       color:'#34d399' },
    { key:'processing', label:'Running',    color:'#4f74f3' },
    { key:'pending',    label:'Queued',     color:'#64748b' },
    { key:'failed',     label:'Failed',     color:'#f87171' },
    { key:'skipped',    label:'Skipped',    color:'#94a3b8' },
  ].filter(st => s[st.key] !== undefined)
  return `
  <div class="bg-surface-700 border border-surface-600 rounded-xl p-4">
    <h3 class="text-sm font-semibold text-white mb-3">${label}</h3>
    <div class="space-y-2">
      ${statuses.map(st => `
      <div class="flex items-center justify-between text-sm">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full" style="background:${st.color}"></div>
          <span class="text-slate-400 text-xs">${st.label}</span>
        </div>
        <span class="font-semibold text-white">${fmt(s[st.key])}</span>
      </div>`).join('')}
    </div>
  </div>`
}

// ─── Drawer ───────────────────────────────────────────────────────────────────
function openDrawer(m) {
  const video = m.videos || {}
  const creator = m.creators || {}
  document.getElementById('drawer-content').innerHTML = `
    <div class="flex items-center justify-between">
      <h2 class="text-lg font-bold text-white">${esc(m.brand_name)}</h2>
      <button onclick="closeDrawer()" class="text-slate-400 hover:text-white p-1">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="flex gap-2 flex-wrap">
      <span class="text-xs px-2 py-1 rounded-full font-medium badge-${m.mention_type}">${m.mention_type}</span>
      <span class="text-xs px-2 py-1 rounded-full badge-${m.sentiment}">${m.sentiment}</span>
      ${platformBadge(creator.platform)}
    </div>

    ${m.context_snippet ? `
    <div class="bg-surface-700 rounded-xl p-4">
      <p class="text-xs text-slate-400 mb-1 uppercase tracking-wider font-medium">Context</p>
      <p class="text-slate-200 text-sm leading-relaxed italic">"${esc(m.context_snippet)}"</p>
      ${m.timestamp_seconds ? `<p class="text-xs text-slate-500 mt-2">@ ${fmtDuration(m.timestamp_seconds)} in video</p>` : ''}
    </div>` : ''}

    <div class="space-y-2 text-sm">
      <div class="flex justify-between py-2 border-b border-surface-600">
        <span class="text-slate-400">Confidence</span>
        <div class="flex items-center gap-2">
          <div class="confidence-bar w-20"><div class="confidence-fill" style="width:${((m.confidence_score||0)*100)}%"></div></div>
          <span class="text-white font-medium">${((m.confidence_score||0)*100).toFixed(0)}%</span>
        </div>
      </div>
      <div class="flex justify-between py-2 border-b border-surface-600">
        <span class="text-slate-400">Creator</span>
        <span class="text-white">${esc(creator.name || '—')} <span class="text-slate-500">@${esc(creator.handle || '')}</span></span>
      </div>
      <div class="flex justify-between py-2 border-b border-surface-600">
        <span class="text-slate-400">Detected</span>
        <span class="text-white">${new Date(m.created_at).toLocaleDateString()}</span>
      </div>
    </div>

    ${video.title ? `
    <div class="bg-surface-700 rounded-xl overflow-hidden">
      ${video.thumbnail_url ? `<img src="${esc(video.thumbnail_url)}" class="w-full h-36 object-cover" />` : ''}
      <div class="p-3">
        <p class="text-white text-sm font-medium">${esc(video.title)}</p>
        <div class="flex gap-3 text-xs text-slate-500 mt-1">
          ${video.view_count ? `<span>${fmt(video.view_count)} views</span>` : ''}
          ${video.duration_seconds ? `<span>${fmtDuration(video.duration_seconds)}</span>` : ''}
          ${video.published_at ? `<span>${new Date(video.published_at).toLocaleDateString()}</span>` : ''}
        </div>
        ${video.video_url ? `<a href="${esc(video.video_url)}" target="_blank" rel="noopener"
          class="inline-block mt-2 text-xs text-brand-400 hover:text-brand-300">Watch video →</a>` : ''}
      </div>
    </div>` : ''}
  `
  document.getElementById('drawer').style.transform = 'translateX(0)'
  document.getElementById('drawer-overlay').classList.remove('hidden')
}

function closeDrawer() {
  document.getElementById('drawer').style.transform = ''
  document.getElementById('drawer-overlay').classList.add('hidden')
}

// ─── Tabs ─────────────────────────────────────────────────────────────────────
const loaded = { mentions: false, brands: false, creators: false, pipeline: false }

function showTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('tab-active',   b.dataset.tab === name)
    b.classList.toggle('tab-inactive', b.dataset.tab !== name)
  })
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'))
  document.getElementById('tab-' + name).classList.remove('hidden')

  if (!loaded[name]) {
    loaded[name] = true
    if (name === 'brands')   loadBrands()
    if (name === 'creators') loadCreators()
    if (name === 'pipeline') loadPipelineDetail()
  }
}

// ─── Utils ────────────────────────────────────────────────────────────────────
function fmt(n) {
  if (n === null || n === undefined) return '—'
  if (n >= 1_000_000) return (n/1_000_000).toFixed(1) + 'M'
  if (n >= 1_000)     return (n/1_000).toFixed(1) + 'K'
  return String(n)
}

function fmtDuration(s) {
  if (!s) return ''
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60
  if (h) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
  return `${m}:${String(sec).padStart(2,'0')}`
}

function relTime(iso) {
  if (!iso) return '—'
  const diff = Date.now() - new Date(iso).getTime()
  const m = Math.floor(diff/60000)
  if (m < 1)   return 'just now'
  if (m < 60)  return m + 'm ago'
  if (m < 1440) return Math.floor(m/60) + 'h ago'
  return Math.floor(m/1440) + 'd ago'
}

function esc(s) {
  if (!s) return ''
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

function platformBadge(p) {
  if (p === 'tiktok')  return '<span class="text-xs bg-pink-500/15 text-pink-400 border border-pink-500/20 px-1.5 py-0.5 rounded">TikTok</span>'
  if (p === 'twitch')  return '<span class="text-xs bg-purple-500/15 text-purple-400 border border-purple-500/20 px-1.5 py-0.5 rounded">Twitch</span>'
  return ''
}

function empty(msg) {
  return `<div class="text-center py-10 text-slate-500 text-sm">${msg}</div>`
}

function errMsg(msg) {
  return `<div class="text-center py-10 text-red-400 text-sm">${msg}</div>`
}

// ─── Refresh icon spin ────────────────────────────────────────────────────────
const style = document.createElement('style')
style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }'
document.head.appendChild(style)
</script>
